# Nums bridge — Sepolia-settled deployment.
#
# Service graph (see deploy/README.md for the full story):
#
#   bootstrap-settlement → katana → configure-piltover → migrate → saya
#                          (long)                       (oneshot)  (long)
#
# All five services share three named volumes:
#   - state:        cross-stage flag files + state.env + rendered profiles
#   - chain-config: katana init rollup output (config.toml + genesis.json)
#   - katana-data:  Katana's blockchain state (RocksDB)
#   - saya-data:    Saya's attestation DB
#
# Plus a read-only bind-mount of the repo root at /repo so sozo can find
# the Cairo sources and the deploy scripts/templates.

name: nums-bridge

# ----- Reusable bits -------------------------------------------------------

x-tools-image: &tools-image
  image: nums-bridge/tools:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile.tools

x-tools-env: &tools-env
  # Sepolia settlement creds. Required by every stage; the operator fills
  # these into `.env` (gitignored). The compose file inherits them via
  # `env_file` below.
  SEPOLIA_RPC_URL: "${SEPOLIA_RPC_URL}"
  SEPOLIA_DEPLOYER_ADDRESS: "${SEPOLIA_DEPLOYER_ADDRESS}"
  SEPOLIA_DEPLOYER_PRIVATE_KEY: "${SEPOLIA_DEPLOYER_PRIVATE_KEY}"
  SEPOLIA_PROVER_PRIVATE_KEY: "${SEPOLIA_PROVER_PRIVATE_KEY}"
  APPCHAIN_CHAIN_ID: "${APPCHAIN_CHAIN_ID}"
  TEE_REGISTRY_SALT: "${TEE_REGISTRY_SALT}"
  NUMS_WORLD_SEED: "${NUMS_WORLD_SEED}"
  STATE_DIR: /state
  REPO_ROOT: /repo
  KATANA_URL: http://katana:5050

x-tools-volumes: &tools-volumes
  - state:/state
  - chain-config:/state/chain-config
  - ../:/repo

# ----- Services ------------------------------------------------------------

services:
  # Stage A — declare/deploy TEE registry mock, katana init rollup.
  # Idempotent; re-running on a populated state volume is a no-op.
  bootstrap-settlement:
    <<: *tools-image
    container_name: nums-bootstrap-settlement
    environment: *tools-env
    volumes: *tools-volumes
    env_file:
      - .env
    command: ["bash", "/repo/deploy/scripts/01_init_settlement.sh"]
    restart: "no"

  # Stage B.1 — long-running appchain Katana. Depends on Stage A having
  # written /state/chain-config; once Stage A exits clean we start.
  katana:
    image: nums-bridge/katana:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.katana
    container_name: nums-katana
    depends_on:
      bootstrap-settlement:
        condition: service_completed_successfully
    environment:
      STATE_DIR: /state
      KATANA_DATA_DIR: /data/katana
    volumes:
      - state:/state:ro
      - chain-config:/state/chain-config:ro
      - katana-data:/data/katana
      - ../deploy/scripts/entrypoint_katana.sh:/entrypoint.sh:ro
      - ../deploy/scripts/lib.sh:/scripts/lib.sh:ro
    ports:
      - "${KATANA_HOST_PORT:-5050}:5050"
    command: ["bash", "/entrypoint.sh"]
    restart: unless-stopped
    healthcheck:
      # Katana is "healthy" once starknet_chainId returns a non-null
      # result — proves the RPC server is up AND the chain spec loaded.
      test:
        - "CMD-SHELL"
        - |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"starknet_chainId","params":[],"id":1}' \
            http://localhost:5050 | jq -e '.result' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Stage B — render Dojo profiles, sozo build + migrate both chains,
  # Setup.set_bridge on both, seed settlement Vault. Oneshot; idempotent.
  #
  # `katana init rollup --tee --tee-registry-address ...` in Stage A
  # already wired Piltover's `ProgramInfo::KatanaTee` and
  # `facts_registry` (see katana/bin/katana/src/cli/init/deployment.rs:
  # 174–212), so there's no separate Piltover-configuration stage.
  #
  # `depends_on: katana` waits for the appchain Katana to be healthy
  # (sozo migrate against the appchain profile points at
  # http://katana:5050).
  migrate:
    <<: *tools-image
    container_name: nums-migrate
    depends_on:
      katana:
        condition: service_healthy
    environment: *tools-env
    volumes: *tools-volumes
    env_file:
      - .env
    command: ["bash", "/repo/deploy/scripts/03_migrate_worlds.sh"]
    restart: "no"

  # Stage D — long-running saya-tee proving + state-root submission.
  saya:
    image: nums-bridge/saya:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.saya
    container_name: nums-saya
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      STATE_DIR: /state
      SAYA_DB_DIR: /data/saya
      KATANA_URL: http://katana:5050
      SEPOLIA_RPC_URL: "${SEPOLIA_RPC_URL}"
      SEPOLIA_DEPLOYER_ADDRESS: "${SEPOLIA_DEPLOYER_ADDRESS}"
      SEPOLIA_DEPLOYER_PRIVATE_KEY: "${SEPOLIA_DEPLOYER_PRIVATE_KEY}"
      SEPOLIA_PROVER_PRIVATE_KEY: "${SEPOLIA_PROVER_PRIVATE_KEY}"
    volumes:
      - state:/state:ro
      - saya-data:/data/saya
      - ../deploy/scripts/entrypoint_saya.sh:/entrypoint.sh:ro
      - ../deploy/scripts/lib.sh:/scripts/lib.sh:ro
    env_file:
      - .env
    command: ["bash", "/entrypoint.sh"]
    restart: unless-stopped

# ----- Volumes -------------------------------------------------------------

volumes:
  # Cross-stage flag files, state.env, manifest copies. Mounted by every
  # service; persists across compose restart (`down` without `-v`).
  state:
  # `katana init rollup` output: config.toml + genesis.json. Read by
  # both bootstrap (writes) and katana (reads).
  chain-config:
  # Katana blockchain state. Persists so restarting the appchain doesn't
  # nuke its history.
  katana-data:
  # Saya attestation DB. Persists so restarting Saya resumes from the
  # last committed block instead of re-proving from genesis.
  saya-data:
