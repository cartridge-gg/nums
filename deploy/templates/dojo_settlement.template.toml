# Rendered at deploy time by deploy/scripts/03_migrate_worlds.sh.
# Placeholders get replaced by `envsubst` from values in /state/state.env
# and the operator's `.env`.
#
# Targeted at Starknet Sepolia (or any settlement chain set in `.env`).
# The Piltover messaging contract address is known BEFORE migrate (the
# bootstrap stage already deployed it), so `bridge_messaging` is filled
# in directly — no post-migrate `Setup.set_bridge` patch needed on
# this side. The appchain profile still gets one because its Setup
# init runs without knowledge of the settlement Piltover address.

[world]
name = "Nums"
# SHARED seed across both profiles. MUST match
# `dojo_appchain.template.toml`'s seed — Dojo derives the world address
# from (class_hash, seed); both chains must land at the same world
# address for the bridge's address-equality invariant
# (mainnet Play addr == appchain Play addr) to hold. See
# `tests/e2e/src/harness.rs::force_play_artifacts_match` for the
# Play-class half of the same story.
seed = "${NUMS_WORLD_SEED}"
description = "Nums settlement world (Sepolia deployment)"
website = "https://nums.gg"

[namespace]
default = "NUMS"

[env]
rpc_url = "${SEPOLIA_RPC_URL}"
account_address = "${SEPOLIA_DEPLOYER_ADDRESS}"
private_key = "${SEPOLIA_DEPLOYER_PRIVATE_KEY}"

[migration]
order_inits = [
  "NUMS-Token",
  "NUMS-Faucet",
  "NUMS-Setup",
  "NUMS-Play",
  "NUMS-Collection",
  "NUMS-Vault",
  "NUMS-Treasury",
]
# Vrf isn't used on the settlement chain (no gameplay happens here),
# so skip its dojo_init.
skip_contracts = ["NUMS-Vrf"]
disable_multicall = true

[writers]
"NUMS" = ["NUMS-Setup", "NUMS-Play"]

[owners]
"NUMS" = ["NUMS-Collection", "NUMS-Vault", "NUMS-Faucet", "NUMS-Token", "NUMS-Treasury"]

[init_call_args]
"NUMS-Vault" = [
  "0x1", # open: true
  "0x0", # fee: 0 basis points
]
"NUMS-Governor" = []
"NUMS-Treasury" = [
  "0xe10",                          # min_delay: 1 hour
  "${SEPOLIA_DEPLOYER_ADDRESS}",    # admin = deployer
]
"NUMS-Token" = [
  "0xD3C21BCECCEDA1000000",         # initial_supply: 1M NUMS
  "${SEPOLIA_DEPLOYER_ADDRESS}",    # recipient = deployer
]
"NUMS-Faucet" = [
  "0x2540BE400",                    # initial_supply: 10K USDC (mock USDC for testing)
  "${SEPOLIA_DEPLOYER_ADDRESS}",    # recipient = deployer
]
"NUMS-Setup" = [
  "0x0",                            # vrf_address: Option::Some prefix
  "${SEPOLIA_DEPLOYER_ADDRESS}",    # vrf_address (placeholder; settlement-side Setup never calls VRF)
  "0x1",                            # quote_address: Option::None — fall back to Faucet via DNS
  "${SEPOLIA_DEPLOYER_ADDRESS}",    # team_address
  "0x0",                            # ekubo_router_address — burn_percentage=0 so unused
  "0x0",                            # ekubo_positions_address — unused
  "0x1E8480",                       # entry_price: 2.000000 USDC
  "0xD3C21BCECCEDA1000000",         # target_supply: 1M NUMS
  "0x0",                            # burn_percentage: 0% (skip Ekubo path for Sepolia deploy)
  "0x32",                           # vault_percentage: 50%
  "0xA",                            # average_score: 10
  "0x0",                            # pool_fee — unused
  "0x0",                            # pool_tick_spacing — unused
  "0x0",                            # pool_extension — unused
  "${SEPOLIA_DEPLOYER_ADDRESS}",    # bundle_allower (free-bundle path)
  "${PILTOVER_ADDRESS}",            # bridge_messaging — Piltover core deployed by Stage A
]
