# Settlement-side Dojo profile. Targets Starknet Sepolia.
#
# private_key is intentionally omitted — sozo reads it from the
# DOJO_PRIVATE_KEY env var, which deploy/scripts/migrate.sh sources from
# SEPOLIA_DEPLOYER_PRIVATE_KEY. Keeps the deployer key out of git.

[world]
name = "Nums"
# SHARED seed across both profiles. MUST match dojo_appchain.toml's seed —
# Dojo derives the world address from (class_hash, seed). Both chains
# landing at the same world address keeps Dojo selectors / dispatcher
# wiring symmetric. The bridge itself routes via Setup.set_bridge's
# explicit `peer` arg, so Play contract addresses no longer need to be
# equal across chains.
seed = "nums-sepolia-v0.0.3"
description = "Nums settlement world (Sepolia deployment)"
website = "https://nums.gg"

[namespace]
default = "NUMS"

[env]
rpc_url = "https://api.cartridge.gg/x/starknet/sepolia"
account_address = "0x02F6B748E2e823916c28CC1F4966fBE7856091B93d0cc1Ca1707dccDbbc801ab"

[migration]
order_inits = [
  "NUMS-Token",
  "NUMS-Faucet",
  "NUMS-Setup",
  "NUMS-Play",
  "NUMS-Collection",
  "NUMS-Vault",
  "NUMS-Treasury",
]
# Vrf isn't used on the settlement chain (no gameplay happens here),
# so skip its dojo_init.
skip_contracts = ["NUMS-Vrf"]
disable_multicall = true

[writers]
"NUMS" = ["NUMS-Setup", "NUMS-Play"]

[owners]
"NUMS" = ["NUMS-Collection", "NUMS-Vault", "NUMS-Faucet", "NUMS-Token", "NUMS-Treasury"]

[init_call_args]
"NUMS-Vault" = [
  "0x1", # open: true
  "0x0", # fee: 0 basis points
]
"NUMS-Governor" = []
"NUMS-Treasury" = [
  "0xe10",                                                                # min_delay: 1 hour
  "0x02F6B748E2e823916c28CC1F4966fBE7856091B93d0cc1Ca1707dccDbbc801ab",   # admin = deployer
]
"NUMS-Token" = [
  "0xD3C21BCECCEDA1000000",                                               # initial_supply: 1M NUMS
  "0x02F6B748E2e823916c28CC1F4966fBE7856091B93d0cc1Ca1707dccDbbc801ab",   # recipient = deployer
]
"NUMS-Faucet" = [
  "0x2540BE400",                                                          # initial_supply: 10K USDC (mock)
  "0x02F6B748E2e823916c28CC1F4966fBE7856091B93d0cc1Ca1707dccDbbc801ab",   # recipient = deployer
]
"NUMS-Setup" = [
  "0x0",                                                                  # vrf_address: Option::Some prefix
  "0x02F6B748E2e823916c28CC1F4966fBE7856091B93d0cc1Ca1707dccDbbc801ab",   # vrf_address (placeholder; settlement-side Setup never calls VRF)
  "0x1",                                                                  # quote_address: Option::None — fall back to Faucet via DNS
  "0x02F6B748E2e823916c28CC1F4966fBE7856091B93d0cc1Ca1707dccDbbc801ab",   # team_address
  "0x0",                                                                  # ekubo_router_address — burn_percentage=0 so unused
  "0x0",                                                                  # ekubo_positions_address — unused
  "0x1E8480",                                                             # entry_price: 2.000000 USDC
  "0xD3C21BCECCEDA1000000",                                               # target_supply: 1M NUMS
  "0x0",                                                                  # burn_percentage: 0% (skip Ekubo path for Sepolia deploy)
  "0x32",                                                                 # vault_percentage: 50%
  "0xA",                                                                  # average_score: 10
  "0x0",                                                                  # pool_fee — unused
  "0x0",                                                                  # pool_tick_spacing — unused
  "0x0",                                                                  # pool_extension — unused
  "0x02F6B748E2e823916c28CC1F4966fBE7856091B93d0cc1Ca1707dccDbbc801ab",   # bundle_allower (free-bundle path)
  "0x2c784f47b6620b46e9b56e1f9616269f7c56ff54e321483fd011fbd9e3f3a0a",     # bridge_messaging — Piltover core on Sepolia
]
